# Configuration for Biaffine Dependency Parser

# Model architecture
bert_model_name: "vinai/phobert-base"
num_labels: 40  # Will be automatically set based on data
arc_mlp_size: 500
label_mlp_size: 100
dropout: 0.33
freeze_bert: false

# Training parameters
learning_rate: 2e-5
bert_learning_rate: 1e-5
weight_decay: 0.01
warmup_steps: 1000
max_epochs: 50
early_stopping_patience: 5

# Data parameters
max_sequence_length: 512
batch_size: 16
accumulation_steps: 1

# Evaluation and saving
eval_steps: 500
save_steps: 1000

# Data paths (relative to project root)
train_path: "../../vi_vtb-ud-train.conllu"
dev_path: "../../vi_vtb-ud-dev.conllu"  
test_path: "../../vi_vtb-ud-test.conllu"
output_dir: "../../experiments/biaffine_parser"